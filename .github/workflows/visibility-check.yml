name: Visibility checks
on:
  push:
    branches: [flow-independent-visibility, visibility-multichannel, stats-reader-behavior, cursor/funcionalidad-real]
  pull_request:
    branches: [cursor/funcionalidad-real]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check server.mjs && node --check visibilidad.mjs && node --check newsletter.mjs && node --check avisos-flow.mjs
      - run: npm run build

      - run: node --check estadisticas.mjs && node scripts/test-stats-journeys.mjs
